spring.application.name=food-service

server.port=8081

# Base URL of restaurant-service (used by RestTemplate to fetch restaurant details)
restaurant.service.url=http://localhost:8082

# MySQL datasource (matches com.mysql:mysql-connector-j on the classpath)
spring.datasource.url=jdbc:mysql://localhost:3306/Fooddb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# silence the open-in-view warning (recommended for services)
spring.jpa.open-in-view=false

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#eureka client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
